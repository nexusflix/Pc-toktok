name: RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:

    runs-on: windows-latest

    timeout-minutes: 350

    env:
      RDP_USER: DANIEL
      BACKUP_RETENTION: 5
      BACKUP_INTERVAL_SECONDS: 600
      MAX_RUNTIME_SECONDS: 33000

      # Disponível para todas as etapas
      TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

    steps:

      # =========================================================
      # 1. CONFIGURAÇÃO DO RDP ghtfg
      # =========================================================

      - name: Configure Core RDP Settings
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " CONFIGURANDO WINDOWS RDP"
          Write-Host "=========================================="

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          netsh advfirewall firewall delete rule `
            name="RDP-Tailscale" `
            2>$null

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Restart-Service `
            -Name TermService `
            -Force

          Write-Host ""
          Write-Host "RDP configurado com sucesso."
          Write-Host ""


      # =========================================================
      # 2. CRIAR USUÁRIO ADMINISTRADOR
      # =========================================================

      - name: Create RDP User with Secure Password
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " CRIANDO USUÁRIO ADMINISTRADOR"
          Write-Host "=========================================="

          Add-Type -AssemblyName System.Security

          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = (
                  [char[]](33..47) +
                  [char[]](58..64) +
                  [char[]](91..96) +
                  [char[]](123..126)
              )
          }

          $rawPassword = @()

          $rawPassword += `
            $charSet.Upper |
            Get-Random -Count 4

          $rawPassword += `
            $charSet.Lower |
            Get-Random -Count 4

          $rawPassword += `
            $charSet.Number |
            Get-Random -Count 4

          $rawPassword += `
            $charSet.Special |
            Get-Random -Count 4

          $password = -join (
              $rawPassword |
              Sort-Object { Get-Random }
          )

          $securePass = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force


          # -----------------------------------------------------
          # REMOVER USUÁRIO ANTIGO
          # -----------------------------------------------------

          $existing = Get-LocalUser `
            -Name $env:RDP_USER `
            -ErrorAction SilentlyContinue

          if ($existing) {

              Write-Host ""
              Write-Host "Usuário existente encontrado."
              Write-Host "Removendo usuário antigo..."

              Remove-LocalUser `
                -Name $env:RDP_USER
          }


          # -----------------------------------------------------
          # CRIAR NOVO USUÁRIO
          # -----------------------------------------------------

          New-LocalUser `
            -Name $env:RDP_USER `
            -Password $securePass `
            -AccountNeverExpires `
            -PasswordNeverExpires


          # -----------------------------------------------------
          # ADMINISTRADOR
          # -----------------------------------------------------

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $env:RDP_USER


          # -----------------------------------------------------
          # RDP USER
          # -----------------------------------------------------

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $env:RDP_USER


          # -----------------------------------------------------
          # GUARDAR CREDENCIAIS NO FORMATO DO CÓDIGO ORIGINAL
          # -----------------------------------------------------

          echo "RDP_CREDS=User: $env:RDP_USER | Password: $password" >> $env:GITHUB_ENV
          echo "PLAIN_PASS=$password" >> $env:GITHUB_ENV


          # -----------------------------------------------------
          # VERIFICAR USUÁRIO
          # -----------------------------------------------------

          $checkUser = Get-LocalUser `
            -Name $env:RDP_USER `
            -ErrorAction SilentlyContinue

          if (-not $checkUser) {

              Write-Error "Falha ao criar usuário RDP."

              exit 1
          }


          Write-Host ""
          Write-Host "=========================================="
          Write-Host " USUÁRIO CRIADO"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "Usuário: $env:RDP_USER"
          Write-Host "Senha criada e armazenada com sucesso."
          Write-Host ""


      # =========================================================
      # 3. VERIFICAR SECRET TAILSCALE
      # =========================================================

      - name: Validate Tailscale Secret
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " VERIFICANDO TAILSCALE"
          Write-Host "=========================================="

          $key = [string]$env:TS_AUTH_KEY

          if ([string]::IsNullOrWhiteSpace($key)) {

              Write-Host ""
              Write-Host "ERRO: TAILSCALE_AUTH_KEY NÃO FOI ENCONTRADO."
              Write-Host ""
              Write-Host "Verifique:"
              Write-Host "Settings"
              Write-Host " -> Secrets and variables"
              Write-Host " -> Actions"
              Write-Host ""
              Write-Host "Nome exato:"
              Write-Host "TAILSCALE_AUTH_KEY"
              Write-Host ""

              exit 1
          }

          Write-Host ""
          Write-Host "TAILSCALE_AUTH_KEY encontrado."
          Write-Host "Tamanho: $($key.Length)"
          Write-Host ""


      # =========================================================
      # 4. INSTALAR TAILSCALE
      # =========================================================

      - name: Install Tailscale
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " INSTALANDO TAILSCALE"
          Write-Host "=========================================="

          $tsUrl = `
            "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

          $installerPath = `
            "$env:TEMP\tailscale.msi"


          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath `
            -UseBasicParsing


          Start-Process `
            msiexec.exe `
            -ArgumentList `
              "/i",
              "`"$installerPath`"",
              "/quiet",
              "/norestart" `
            -Wait


          Remove-Item `
            $installerPath `
            -Force `
            -ErrorAction SilentlyContinue


          $tailscale = `
            "$env:ProgramFiles\Tailscale\tailscale.exe"


          if (-not (Test-Path $tailscale)) {

              Write-Error `
                "tailscale.exe não foi encontrado após a instalação."

              exit 1
          }


          Write-Host ""
          Write-Host "Tailscale instalado."
          Write-Host ""


      # =========================================================
      # 5. CONECTAR TAILSCALE
      # =========================================================

      - name: Establish Tailscale Connection
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " CONECTANDO AO TAILSCALE"
          Write-Host "=========================================="

          $tailscale = `
            "$env:ProgramFiles\Tailscale\tailscale.exe"


          if (-not (Test-Path $tailscale)) {

              Write-Error `
                "tailscale.exe não encontrado."

              exit 1
          }


          if ([string]::IsNullOrWhiteSpace($env:TS_AUTH_KEY)) {

              Write-Error `
                "TAILSCALE_AUTH_KEY está vazio."

              exit 1
          }


          Write-Host ""
          Write-Host "Iniciando Tailscale..."
          Write-Host ""


          & $tailscale up `
            --auth-key="$env:TS_AUTH_KEY" `
            --hostname="gh-runner-$env:GITHUB_RUN_ID" `
            --accept-dns=true `
            --accept-routes=true


          if ($LASTEXITCODE -ne 0) {

              Write-Error `
                "Falha ao executar tailscale up."

              exit 1
          }


          Write-Host ""
          Write-Host "Tailscale conectado."
          Write-Host ""


          # -----------------------------------------------------
          # AGUARDAR IP
          # -----------------------------------------------------

          $tsIP = $null


          for ($i = 1; $i -le 30; $i++) {

              $candidate = (
                  & $tailscale ip -4 2>$null |
                  Select-Object -First 1
              )


              if ($candidate) {

                  $candidate = $candidate.Trim()


                  if (
                      $candidate -match `
                      '^\d{1,3}(\.\d{1,3}){3}$'
                  ) {

                      $tsIP =$candidate

                      break
                  }
              }


              Write-Host `
                "Aguardando IP Tailscale... tentativa $i/30"


              Start-Sleep `
                -Seconds 5
          }


          if (-not $tsIP) {

              Write-Host ""
              Write-Host "STATUS TAILSCALE:"
              Write-Host ""

              & $tailscale status

              Write-Error `
                "Não foi possível obter o IP Tailscale."

              exit 1
          }


          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV


          Write-Host ""
          Write-Host "=========================================="
          Write-Host " TAILSCALE CONECTADO"
          Write-Host " IP: $tsIP"
          Write-Host "=========================================="
          Write-Host ""


      # =========================================================
      # 6. VERIFICAR TAILSCALE
      # =========================================================

      - name: Verify Tailscale Connection
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          $tailscale = `
            "$env:ProgramFiles\Tailscale\tailscale.exe"


          Write-Host "=========================================="
          Write-Host " STATUS TAILSCALE"
          Write-Host "=========================================="

          & $tailscale status


          Write-Host ""
          Write-Host "IP Tailscale:"
          Write-Host $env:TAILSCALE_IP
          Write-Host ""


      # =========================================================
      # 7. VERIFICAR PORTA RDP
      # =========================================================

      - name: Verify RDP Accessibility
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " TESTANDO RDP"
          Write-Host "=========================================="


          $rdpPort = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue


          if (-not $rdpPort) {

              Write-Host ""
              Write-Host "Porta 3389 não está ouvindo."
              Write-Host "Reiniciando TermService..."
              Write-Host ""

              Restart-Service `
                -Name TermService `
                -Force


              Start-Sleep `
                -Seconds 5


              $rdpPort = Get-NetTCPConnection `
                -LocalPort 3389 `
                -State Listen `
                -ErrorAction SilentlyContinue
          }


          if (-not $rdpPort) {

              Write-Error `
                "RDP não está ouvindo na porta 3389."

              exit 1
          }


          Write-Host ""
          Write-Host "Porta 3389 está ativa."
          Write-Host ""
          Write-Host "IP Tailscale: $env:TAILSCALE_IP"
          Write-Host ""


      # =========================================================
      # 8. PREPARAR BACKUP
      # =========================================================

      - name: Prepare Backup System
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          $backupRoot = "C:\RDP\Backups"


          New-Item `
            -ItemType Directory `
            -Path "C:\RDP" `
            -Force |
            Out-Null


          New-Item `
            -ItemType Directory `
            -Path $backupRoot `
            -Force |
            Out-Null


          Write-Host ""
          Write-Host "Sistema de backup preparado."
          Write-Host ""


      # =========================================================
      # 9. MOSTRAR DADOS + MANTER RDP
      # =========================================================

      - name: Maintain RDP Connection
        shell: powershell
        run: |

          $ErrorActionPreference = "Continue"


          $startTime = Get-Date


          $interval = `
            [int]$env:BACKUP_INTERVAL_SECONDS


          $maxRuntime = `
            [int]$env:MAX_RUNTIME_SECONDS


          # =====================================================
          # DADOS PARA LOGIN (USANDO SINTAXE DO CÓDIGO ORIGINAL)
          # =====================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "          NEXUS RDP ONLINE"
          Write-Host "=========================================="
          Write-Host ""

          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USER"
          Write-Host "Credentials: $env:RDP_CREDS"
          Write-Host "Password: $env:PLAIN_PASS"
          Write-Host "PORT: 3389"

          Write-Host ""

          Write-Host "=========================================="
          Write-Host " USE ESTES DADOS PARA CONECTAR"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "IP: $env:TAILSCALE_IP"
          Write-Host "USER: $env:RDP_USER"
          Write-Host "PASSWORD: $env:PLAIN_PASS"
          Write-Host ""

          Write-Host "=========================================="
          Write-Host ""


          while ($true) {

              $elapsed = (
                  (Get-Date) - $startTime
              ).TotalSeconds


              # -------------------------------------------------
              # TEMPO MÁXIMO
              # -------------------------------------------------

              if ($elapsed -ge$maxRuntime) {

                  Write-Host ""
                  Write-Host "=========================================="
                  Write-Host " TEMPO MÁXIMO ATINGIDO"
                  Write-Host " ENCERRANDO RUNNER"
                  Write-Host "=========================================="
                  Write-Host ""

                  break
              }


              # -------------------------------------------------
              # VERIFICAR RDP
              # -------------------------------------------------

              $rdp = Get-NetTCPConnection `
                -LocalPort 3389 `
                -State Listen `
                -ErrorAction SilentlyContinue


              if (-not $rdp) {

                  Write-Host ""
                  Write-Host "RDP offline."
                  Write-Host "Reiniciando TermService..."

                  Restart-Service `
                    -Name TermService `
                    -Force `
                    -ErrorAction SilentlyContinue


                  Start-Sleep `
                    -Seconds 5
              }


              # -------------------------------------------------
              # VERIFICAR TAILSCALE
              # -------------------------------------------------

              $tailscale = `
                "$env:ProgramFiles\Tailscale\tailscale.exe"


              $currentIP = (
                  & $tailscale ip -4 2>$null |
                  Select-Object -First 1
              )


              if (-not $currentIP) {

                  Write-Host ""
                  Write-Host "Tailscale offline."
                  Write-Host "Tentando reconectar..."
                  Write-Host ""


                  if (
                      -not [string]::IsNullOrWhiteSpace(
                          $env:TS_AUTH_KEY
                      )
                  ) {

                      & $tailscale up `
                        --auth-key="$env:TS_AUTH_KEY" `
                        --hostname="gh-runner-$env:GITHUB_RUN_ID" `
                        --accept-dns=true `
                        --accept-routes=true
                  }


                  Start-Sleep `
                    -Seconds 5
              }


              # -------------------------------------------------
              # STATUS
              # -------------------------------------------------

              $now = Get-Date

              Write-Host ""
              Write-Host "[$now] RDP ativo"
              Write-Host "IP: $env:TAILSCALE_IP"
              Write-Host "USER: $env:RDP_USER"
              Write-Host "PASSWORD: $env:PLAIN_PASS"
              Write-Host "Tempo: $([math]::Round($elapsed / 60, 1)) minutos"


              # -------------------------------------------------
              # ESPERA
              # -------------------------------------------------

              Start-Sleep `
                -Seconds 60
          }


      # =========================================================
      # 10. BACKUP FINAL
      # =========================================================

      - name: Create Final Backup
        if: always()
        shell: powershell
        run: |

          $ErrorActionPreference = "Continue"

          Write-Host "=========================================="
          Write-Host " CRIANDO BACKUP FINAL"
          Write-Host "=========================================="


          $backupRoot = `
            "C:\RDP\Backups"


          New-Item `
            -ItemType Directory `
            -Path $backupRoot `
            -Force |
            Out-Null


          $backupFile = Join-Path `
            $backupRoot `
            "DANIEL-Profile-$env:GITHUB_RUN_ID.zip"


          $folders = @(

              "$env:USERPROFILE\Desktop"

              "$env:USERPROFILE\Documents"

              "$env:USERPROFILE\Downloads"

              "$env:USERPROFILE\Pictures"

              "$env:USERPROFILE\Videos"

              "$env:USERPROFILE\Music"

          )


          $existingFolders = @()


          foreach ($folder in$folders) {

              if (Test-Path $folder) {

                  $existingFolders +=$folder
              }
          }


          if ($existingFolders.Count -gt 0) {

              Compress-Archive `
                -Path $existingFolders `
                -DestinationPath $backupFile `
                -Force `
                -ErrorAction SilentlyContinue


              if (Test-Path $backupFile) {

                  $hash = Get-FileHash `
                    $backupFile `
                    -Algorithm SHA256


                  "$($hash.Hash)  $($hash.Path)" |
                    Out-File `
                      "$backupFile.sha256" `
                      -Encoding UTF8


                  Write-Host ""
                  Write-Host "Backup criado:"
                  Write-Host $backupFile

                  Write-Host ""

                  Write-Host "SHA256:"
                  Write-Host $hash.Hash

                  Write-Host ""
              }
          }


      # =========================================================
      # 11. ENVIAR BACKUP
      # =========================================================

      - name: Upload RDP Backup
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: rdp-backup-${{ github.run_id }}

          path: |
            C:\RDP\Backups\*.zip
            C:\RDP\Backups\*.sha256

          retention-days: 5

          if-no-files-found: warn
